title = "Josiah Campbell"
baseURL = "https://jocmp.com/"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[taxonomies]

[params]
  description = ""
  about_me = "Web dev with a heart for mobile apps."
  ogimage = "/avatar.jpg"
  github_username = "https://github.com/jocmp"
  mastodon_username = "https://mastodon.social/@_jocmp"

[params.author]
  name = "Josiah Campbell"
  avatar = "/avatar.jpg"

[markup.goldmark.renderer]
  unsafe = true

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static/uploads"
  target = "assets/uploads"

[[module.mounts]]
  source = "static"
  target = "static"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
